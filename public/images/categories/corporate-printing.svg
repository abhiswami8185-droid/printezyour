<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg17" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="diaryGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#292524" />
    </linearGradient>
    <filter id="corpShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000" flood-opacity="0.55" />
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#bg17)" />

  <!-- Hardcover Corporate Executive Diary / Annual Report -->
  <g transform="translate(110, 45)" filter="url(#corpShadow)">
    <!-- Book Gilt Pages Edge -->
    <rect x="165" y="10" width="15" height="200" rx="3" fill="#ca8a04" stroke="#eab308" stroke-width="0.5" />
    <rect x="8" y="6" width="168" height="206" rx="6" fill="#f8fafc" />

    <!-- Front Leatherette Cover -->
    <rect width="170" height="215" rx="8" fill="url(#diaryGrad)" stroke="#44403c" stroke-width="1.5" />
    
    <!-- Satin Silk Bookmark Ribbon dangling out -->
    <path d="M 85 0 C 85 100 85 210 95 235 L 105 230 L 115 235 C 105 210 105 100 105 0 Z" fill="#dc2626" />

    <!-- Blind Debossed Year & Corporate Logo -->
    <rect x="25" y="45" width="120" height="120" rx="6" fill="#171513" stroke="#292524" stroke-width="1" />
    <circle cx="85" cy="85" r="22" fill="none" stroke="#d97706" stroke-width="2" />
    <path d="M 85 70 L 98 95 L 72 95 Z" fill="#d97706" />
    
    <text x="85" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="12" fill="#d97706" letter-spacing="2">PRINTEZYOUR</text>
    <text x="85" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="9" fill="#f5f5f4" letter-spacing="3">2026</text>
    <text x="85" y="152" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" font-size="6" fill="#a8a29e" letter-spacing="1">EXECUTIVE EDITION</text>
  </g>
</svg>