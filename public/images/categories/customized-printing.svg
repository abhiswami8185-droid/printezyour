<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1e38" />
    </linearGradient>
    <linearGradient id="mugGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="20%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="mugShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="12" stdDeviation="10" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#bg6)" />

  <!-- Folded Corporate Polo Shirt (Background) -->
  <g transform="translate(60, 50)" filter="url(#mugShadow)">
    <path d="M 50 20 L 15 65 L 45 75 L 50 190 L 190 190 L 195 75 L 225 65 L 190 20 Z" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <!-- Collar -->
    <polygon points="90,20 120,60 150,20 120,30" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <!-- Buttons placket -->
    <rect x="114" y="30" width="12" height="45" fill="#0f172a" />
    <circle cx="120" cy="42" r="2" fill="#cbd5e1" />
    <circle cx="120" cy="58" r="2" fill="#cbd5e1" />
    <!-- Chest Embroidered Logo -->
    <circle cx="160" cy="65" r="9" fill="#0284c7" />
    <text x="160" y="68" text-anchor="middle" font-family="system-ui" font-weight="900" font-size="7" fill="#ffffff">PZ</text>
  </g>

  <!-- Ceramic Coffee Mug (Foreground Hero) -->
  <g transform="translate(195, 80)" filter="url(#mugShadow)">
    <!-- Mug Handle -->
    <path d="M 100 35 C 145 35, 145 95, 100 95" fill="none" stroke="url(#mugGrad)" stroke-width="14" stroke-linecap="round" />
    <path d="M 100 35 C 145 35, 145 95, 100 95" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" />

    <!-- Mug Cylinder Body -->
    <rect x="15" y="15" width="95" height="120" rx="10" fill="url(#mugGrad)" stroke="#94a3b8" stroke-width="1" />
    <ellipse cx="62.5" cy="15" rx="47.5" ry="10" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1" />
    <ellipse cx="62.5" cy="15" rx="42" ry="7" fill="#475569" />

    <!-- Sublimation Printed Wrap-Around Graphics -->
    <rect x="25" y="45" width="75" height="65" rx="4" fill="#06b6d4" />
    <polygon points="62,55 76,80 48,80" fill="#ffffff" />
    <circle cx="62" cy="70" r="4" fill="#0f172a" />
    <text x="62.5" y="96" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="8" fill="#ffffff" letter-spacing="1">PRINTEZ</text>
    <text x="62.5" y="104" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" font-size="5" fill="#f0fdfa">CUSTOM CERAMIC</text>

    <!-- Glossy Specular Light Reflection -->
    <path d="M 22 25 L 32 25 L 32 125 L 22 125 Z" fill="#ffffff" opacity="0.4" />
  </g>
</svg>