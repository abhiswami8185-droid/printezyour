<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg18" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#1e1e38" />
    </linearGradient>
    <filter id="brandShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#bg18)" />

  <!-- Unified Corporate Identity Suite Mockup (Letterhead + Mug + Visiting Card + Pen) -->
  <!-- 1. Folder / Letterhead in background -->
  <g transform="translate(60, 45)" filter="url(#brandShadow)">
    <rect width="180" height="215" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="0" y="0" width="180" height="30" fill="#0284c7" />
    <text x="90" y="20" text-anchor="middle" font-family="system-ui" font-weight="900" font-size="9" fill="#ffffff">BRAND IDENTITY KIT</text>
    <rect x="20" y="50" width="80" height="3" rx="1.5" fill="#94a3b8" />
    <rect x="20" y="60" width="140" height="2.5" rx="1" fill="#cbd5e1" />
    <rect x="20" y="68" width="130" height="2.5" rx="1" fill="#cbd5e1" />
  </g>

  <!-- 2. Branded Ceramic Mug -->
  <g transform="translate(230, 60)" filter="url(#brandShadow)">
    <rect x="15" y="10" width="75" height="90" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <path d="M 90 25 C 115 25, 115 70, 90 70" fill="none" stroke="#e2e8f0" stroke-width="10" stroke-linecap="round" />
    <rect x="25" y="30" width="55" height="45" rx="3" fill="#0284c7" />
    <circle cx="52" cy="52" r="10" fill="#ffffff" />
    <text x="52" y="55" text-anchor="middle" font-family="system-ui" font-weight="900" font-size="7" fill="#0284c7">PZ</text>
  </g>

  <!-- 3. Matching Business Card -->
  <g transform="translate(180, 155) rotate(-5)" filter="url(#brandShadow)">
    <rect width="140" height="85" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="20" y="32" font-family="system-ui" font-weight="900" font-size="9" fill="#38bdf8">PRINTEZYOUR</text>
    <text x="20" y="44" font-family="system-ui" font-weight="600" font-size="6" fill="#ffffff">Full Branding Solutions</text>
    <line x1="20" y1="52" x2="120" y2="52" stroke="#0284c7" stroke-width="1" />
    <text x="20" y="66" font-family="monospace" font-size="5" fill="#94a3b8">+91 8557049897</text>
  </g>

  <!-- 4. Branded Pen -->
  <g transform="translate(170, 245) rotate(-5)" filter="url(#brandShadow)">
    <rect x="0" y="0" width="130" height="9" rx="2" fill="#0284c7" />
    <rect x="100" y="-2" width="25" height="3" rx="1" fill="#cbd5e1" />
    <polygon points="0,0 0,9 -12,4.5" fill="#cbd5e1" />
  </g>
</svg>