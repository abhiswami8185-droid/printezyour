<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./logo-icon.svg" />
    <link rel="alternate icon" type="image/png" href="./logo.png" />
    <title>PrintezYour - Modern Printing & E-Commerce System</title>
    <meta name="description" content="Official website, online custom printing ordering system, and business management portal for PrintezYour (Chandigarh)." />
    <meta property="og:title" content="PrintezYour - Modern Printing & E-Commerce System" />
    <meta property="og:description" content="Official website, online custom printing ordering system, and business management portal for PrintezYour (Chandigarh)." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": "PrintezYour",
      "image": "/logo.png",
      "telephone": "+918557049897",
      "email": "printezyour@gmail.com",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Plot No 1794, Gym Deep Complex, Hallo Majra, Near Urban Akhada",
        "addressLocality": "Chandigarh",
        "postalCode": "160002",
        "addressCountry": "IN"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 30.7046,
        "longitude": 76.7985
      },
      "openingHoursSpecification": [
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
          "opens": "09:00",
          "closes": "19:00"
        },
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Saturday"],
          "opens": "10:00",
          "closes": "18:00"
        }
      ],
      "priceRange": "₹₹",
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.9",
        "reviewCount": "120"
      }
    }
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased selection:bg-cyan-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
