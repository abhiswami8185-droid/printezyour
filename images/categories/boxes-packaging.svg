<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg9" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="boxTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c29b68" />
      <stop offset="100%" stop-color="#dfbe8f" />
    </linearGradient>
    <linearGradient id="boxLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a7342" />
      <stop offset="100%" stop-color="#735227" />
    </linearGradient>
    <linearGradient id="boxRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b08855" />
      <stop offset="100%" stop-color="#8c6534" />
    </linearGradient>
    <filter id="boxShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#bg9)" />

  <!-- 3D Isometric Corrugated Mailer Box -->
  <g transform="translate(200, 140)" filter="url(#boxShadow)">
    <!-- Top Lid Face -->
    <polygon points="0,-75 110,-20 0,35 -110,-20" fill="url(#boxTop)" stroke="#b08855" stroke-width="1.5" />
    
    <!-- Printed Logo on Top Lid -->
    <g transform="rotate(30) skewX(-30) scale(0.7) translate(-35, -70)">
      <rect x="0" y="0" width="100" height="50" rx="4" fill="#0f172a" />
      <text x="50" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="10" fill="#06b6d4">PRINTEZYOUR</text>
      <text x="50" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="6" fill="#f8fafc">CUSTOM PACKAGING</text>
    </g>

    <!-- Left Flap / Side -->
    <polygon points="-110,-20 0,35 0,115 -110,60" fill="url(#boxLeft)" stroke="#735227" stroke-width="1.5" />
    <!-- Corrugated E-flute edge details -->
    <line x1="-110" y1="-20" x2="-110" y2="60" stroke="#5c401d" stroke-width="3" />

    <!-- Right Flap / Side -->
    <polygon points="0,35 110,-20 110,60 0,115" fill="url(#boxRight)" stroke="#8c6534" stroke-width="1.5" />

    <!-- Shipping Barcode & Dispatch Label on Right Side -->
    <g transform="translate(15, 45) skewY(26) scale(0.65)">
      <rect width="90" height="55" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="45" y="14" text-anchor="middle" font-family="system-ui" font-weight="bold" font-size="7" fill="#0f172a">PRIORITY DISPATCH</text>
      <path d="M 10 20 h2 v22 h-2 z M 14 20 h3 v22 h-3 z M 19 20 h1 v22 h-1 z M 22 20 h4 v22 h-4 z M 28 20 h2 v22 h-2 z M 32 20 h1 v22 h-1 z M 35 20 h3 v22 h-3 z M 40 20 h2 v22 h-2 z M 44 20 h4 v22 h-4 z M 50 20 h1 v22 h-1 z M 53 20 h3 v22 h-3 z M 58 20 h2 v22 h-2 z M 62 20 h1 v22 h-1 z M 65 20 h3 v22 h-3 z M 70 20 h2 v22 h-2 z M 74 20 h4 v22 h-4 z M 80 20 h1 v22 h-1 z" fill="#000" />
      <text x="45" y="49" text-anchor="middle" font-family="monospace" font-size="5" fill="#475569">AWB-8557049897</text>
    </g>

    <!-- Corrugated 3-ply flute profile lines -->
    <line x1="0" y1="35" x2="0" y2="115" stroke="#5c401d" stroke-width="2" />
  </g>
</svg>