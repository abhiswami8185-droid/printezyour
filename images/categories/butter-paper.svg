<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>
    <filter id="paperShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#bg5)" />

  <!-- Bakery / Food Tabletop Texture -->
  <rect x="30" y="30" width="340" height="240" rx="8" fill="#3f3f46" opacity="0.3" />

  <!-- Sheet 2 underneath (Layered) -->
  <g transform="translate(60, 50) rotate(-6)" filter="url(#paperShadow)">
    <rect width="250" height="180" rx="4" fill="#fdfbf7" opacity="0.75" stroke="#e4e4e7" stroke-width="1" />
  </g>

  <!-- Sheet 1 Main Semi-Translucent Butter Paper -->
  <g transform="translate(75, 45) rotate(3)" filter="url(#paperShadow)">
    <rect width="250" height="190" rx="4" fill="#faf8f2" opacity="0.88" stroke="#d4d4d8" stroke-width="1" />
    
    <!-- Repeating Food-Grade Monogram Pattern -->
    <g fill="#991b1b" opacity="0.7" transform="scale(0.85)">
      <!-- Row 1 -->
      <g transform="translate(40, 35)">
        <circle cx="0" cy="0" r="14" fill="none" stroke="#991b1b" stroke-width="1.5" />
        <text x="0" y="4" text-anchor="middle" font-family="serif" font-weight="bold" font-size="9">PZ</text>
        <text x="0" y="24" text-anchor="middle" font-family="system-ui" font-size="5" letter-spacing="1">ARTISAN</text>
      </g>
      <g transform="translate(130, 35)">
        <circle cx="0" cy="0" r="14" fill="none" stroke="#991b1b" stroke-width="1.5" />
        <text x="0" y="4" text-anchor="middle" font-family="serif" font-weight="bold" font-size="9">PZ</text>
        <text x="0" y="24" text-anchor="middle" font-family="system-ui" font-size="5" letter-spacing="1">ARTISAN</text>
      </g>
      <g transform="translate(220, 35)">
        <circle cx="0" cy="0" r="14" fill="none" stroke="#991b1b" stroke-width="1.5" />
        <text x="0" y="4" text-anchor="middle" font-family="serif" font-weight="bold" font-size="9">PZ</text>
        <text x="0" y="24" text-anchor="middle" font-family="system-ui" font-size="5" letter-spacing="1">ARTISAN</text>
      </g>

      <!-- Row 2 -->
      <g transform="translate(85, 95)">
        <circle cx="0" cy="0" r="14" fill="none" stroke="#991b1b" stroke-width="1.5" />
        <text x="0" y="4" text-anchor="middle" font-family="serif" font-weight="bold" font-size="9">PZ</text>
        <text x="0" y="24" text-anchor="middle" font-family="system-ui" font-size="5" letter-spacing="1">ARTISAN</text>
      </g>
      <g transform="translate(175, 95)">
        <circle cx="0" cy="0" r="14" fill="none" stroke="#991b1b" stroke-width="1.5" />
        <text x="0" y="4" text-anchor="middle" font-family="serif" font-weight="bold" font-size="9">PZ</text>
        <text x="0" y="24" text-anchor="middle" font-family="system-ui" font-size="5" letter-spacing="1">ARTISAN</text>
      </g>

      <!-- Row 3 -->
      <g transform="translate(40, 155)">
        <circle cx="0" cy="0" r="14" fill="none" stroke="#991b1b" stroke-width="1.5" />
        <text x="0" y="4" text-anchor="middle" font-family="serif" font-weight="bold" font-size="9">PZ</text>
        <text x="0" y="24" text-anchor="middle" font-family="system-ui" font-size="5" letter-spacing="1">ARTISAN</text>
      </g>
      <g transform="translate(130, 155)">
        <circle cx="0" cy="0" r="14" fill="none" stroke="#991b1b" stroke-width="1.5" />
        <text x="0" y="4" text-anchor="middle" font-family="serif" font-weight="bold" font-size="9">PZ</text>
        <text x="0" y="24" text-anchor="middle" font-family="system-ui" font-size="5" letter-spacing="1">ARTISAN</text>
      </g>
      <g transform="translate(220, 155)">
        <circle cx="0" cy="0" r="14" fill="none" stroke="#991b1b" stroke-width="1.5" />
        <text x="0" y="4" text-anchor="middle" font-family="serif" font-weight="bold" font-size="9">PZ</text>
        <text x="0" y="24" text-anchor="middle" font-family="system-ui" font-size="5" letter-spacing="1">ARTISAN</text>
      </g>
    </g>

    <!-- Translucent paper greaseproof corner fold -->
    <polygon points="215,0 250,35 215,35" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1" />
    <text x="125" y="200" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="8" fill="#52525b" letter-spacing="1.5">FOOD-GRADE 40 GSM GREASEPROOF</text>
  </g>
</svg>